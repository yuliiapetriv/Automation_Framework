name: Run UI & API Tests

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
    inputs:
      TEST_GROUP:
        description: 'Select test group: ui / api / all'
        required: false
        default: 'all'

jobs:
  tests:
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ui
            suite: src/test/resources/suites/ui_tests.xml
          - group: api
            suite: src/test/resources/suites/api_tests.xml

    env:
      ALLURE_RESULTS: target/allure-results-${{ matrix.group }}
      ALLURE_REPORT: target/site/allure-maven-plugin-${{ matrix.group }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with Maven
        if: ${{ github.event.inputs.TEST_GROUP == 'all' || matrix.group == github.event.inputs.TEST_GROUP }}
        run: |
          echo "Running ${{ matrix.group }} tests..."
          mvn -B -e -ntp clean test \
            -Dsuite=${{ matrix.suite }} \
            -Dallure.results.directory=${{ env.ALLURE_RESULTS }} \
            -Dmaven.test.failure.ignore=true

      - name: Generate Allure Report
        if: always()
        run: |
          echo "Generating Allure HTML report for ${{ matrix.group }}..."
          mvn allure:report \
            -Dallure.results.directory=${{ env.ALLURE_RESULTS }} \
            -Dallure.report.directory=${{ env.ALLURE_REPORT }}
          ls -R ${{ env.ALLURE_REPORT }}

      - name: Upload Allure HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-${{ matrix.group }}
          path: ${{ env.ALLURE_REPORT }}

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download UI report
        uses: actions/download-artifact@v4
        with:
          name: allure-ui
          path: allure/ui

      - name: Download API report
        uses: actions/download-artifact@v4
        with:
          name: allure-api
          path: allure/api

      - name: Check Allure directories
        run: |
          echo "Contents of allure directory before deploy:"
          ls -R allure

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure
          publish_branch: gh-pages
          force_orphan: true

      - name: Show Allure Report URLs
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          echo "UI report: https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO_NAME/ui/index.html"
          echo "API report: https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO_NAME/api/index.html"
